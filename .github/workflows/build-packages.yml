name: Build Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test script
        run: |
          shellcheck count_files.sh
          bash count_files.sh -h
          bash count_files.sh -r -e conf /etc

  build-rpm:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fedora: [44, 45]
    container: fedora:${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: dnf install -y rpm-build

      - name: Prepare sources
        run: |
          mkdir -p ~/rpmbuild/SOURCES/count-files-2.0
          cp count_files.sh count_files.1 count-files.conf ~/rpmbuild/SOURCES/count-files-2.0/
          cd ~/rpmbuild/SOURCES
          tar czvf count-files-2.0.tar.gz count-files-2.0

      - name: Build RPM
        run: rpmbuild -ba packaging/rpm/count-files.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package-fc${{ matrix.fedora }}
          path: ~/rpmbuild/RPMS/noarch/*.rpm

  build-deb:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Allow caching apt packages
        run: sudo chown "$USER" /var/cache/apt/archives

      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-packages

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper

      - name: Prepare build directory
        run: |
          mkdir -p build/count-files-2.0
          cp count_files.sh count_files.1 count-files.conf build/count-files-2.0/
          cp -r packaging/deb/debian build/count-files-2.0/

      - name: Build DEB
        run: |
          cd build/count-files-2.0
          dpkg-buildpackage -us -uc -b

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: build/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" ./*.rpm ./*.deb --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
